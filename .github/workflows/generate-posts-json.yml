name: Update Posts Index
on:
  push:
    paths:
      - 'posts/*.md'
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          
      - name: Install dependencies
        run: npm install gray-matter remark remark-parse remark-frontmatter unist-util-visit
      
      - name: Generate index.json
        run: |
          mkdir -p posts
          # Create a Node script to process the files
          cat << 'EOF' > process-posts.js
          const fs = require('fs');
          const path = require('path');
          const matter = require('gray-matter');
          const { remark } = require('remark');
          const remarkParse = require('remark-parse');
          const remarkFrontmatter = require('remark-frontmatter');
          const { visit } = require('unist-util-visit');
          
          const postsDir = 'posts';
          const files = fs.readdirSync(postsDir)
            .filter(file => file.endsWith('.md'))
            .sort()
            .reverse();
          
          const extractMarkdownMetadata = (content) => {
            let title = '';
            let excerpt = '';
            let firstParagraph = true;
            
            const tree = remark()
              .use(remarkParse)
              .use(remarkFrontmatter)
              .parse(content);
            
            visit(tree, (node) => {
              // Extract title from first heading
              if (node.type === 'heading' && node.depth === 1 && !title) {
                title = node.children[0].value;
              }
              
              // Extract excerpt from first paragraph
              if (node.type === 'paragraph' && firstParagraph) {
                excerpt = node.children
                  .filter(n => n.type === 'text')
                  .map(n => n.value)
                  .join(' ')
                  .substring(0, 200); // Limit excerpt length
                firstParagraph = false;
              }
            });
            
            return { title, excerpt };
          };
          
          const posts = files.map(file => {
            const content = fs.readFileSync(path.join(postsDir, file), 'utf8');
            const { data } = matter(content);
            const markdownMetadata = extractMarkdownMetadata(content);
            
            return {
              title: data.title || markdownMetadata.title || file.replace('.md', '').replace(/^\d{4}-\d{2}-\d{2}-/, ''),
              slug: file.replace('.md', ''),
              date: data.date || file.match(/^\d{4}-\d{2}-\d{2}/)?.[0] || '',
              excerpt: data.excerpt || markdownMetadata.excerpt || ''
            };
          });
          
          fs.writeFileSync(
            path.join(postsDir, 'index.json'),
            JSON.stringify(posts, null, 2)
          );
          EOF
          
          node process-posts.js
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add posts/index.json
          git diff --cached --quiet || git commit -m "Update posts index"
          git push
