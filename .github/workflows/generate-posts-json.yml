name: Update Posts Index
on:
  push:
    paths:
      - 'posts/*.md'
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate index.json
        run: |
          mkdir -p posts
          files=$(find posts -name "*.md" -printf "%f\n" | sort -r)
          echo "$files" | jq -R -s 'split("\n") | map(select(. != ""))' > posts/index.json
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add posts/index.json
          git diff --cached --quiet || git commit -m "Update posts index"
          git push
