name: Update Posts Index

on:
  push:
    paths:
      - 'posts/*.md'
      - 'posts/*.markdown'
  workflow_dispatch:  # Allows manual trigger

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate posts index JSON
        run: |
          mkdir -p posts
          
          # Find markdown files, sort newest first, and build JSON
          files=$(find posts -maxdepth 1 -type f \( -name "*.md" -o -name "*.markdown" \) -printf "%f\n" | sort -r)
          
          # If no files, output empty array
          if [ -z "$files" ]; then
            echo "[]" > posts/index.json
          else
            printf "[\n" > posts/index.json
            first=true
            while IFS= read -r file; do
              if [ "$first" = true ]; then
                first=false
              else
                printf ",\n" >> posts/index.json
              fi
              printf "  \"%s\"" "$file" >> posts/index.json
            done <<< "$files"
            printf "\n]\n" >> posts/index.json
          fi
          
          echo "Generated index.json:"
          cat posts/index.json

      - name: Commit & push if changed
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add posts/index.json
          if ! git diff --cached --quiet; then
            git commit -m "Update posts index"
            git push
          else
            echo "No changes to commit."
          fi
