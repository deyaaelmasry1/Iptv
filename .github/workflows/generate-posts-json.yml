name: Generate Posts JSON Index

on:
  push:
    paths:
      - 'posts/*.md'
      - 'posts/*.markdown'
  workflow_dispatch:  # Manual trigger

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate git diff

      - name: Generate JSON index
        id: generate-json
        run: |
          set -euo pipefail  # Strict error handling
          mkdir -p posts

          # Find all .md/.markdown files, sort by newest first
          files=$(find posts -maxdepth 1 -type f \( -name "*.md" -o -name "*.markdown" \) -printf "%f\n" | sort -r)

          # Generate JSON (using jq if available, fallback to manual)
          if ! command -v jq &> /dev/null; then
            echo "::warning::jq not found. Using manual JSON generation."
            if [ -z "$files" ]; then
              echo "[]" > posts/index.json
            else
              printf "[\n" > posts/index.json
              first=true
              while IFS= read -r file; do
                if [ "$first" = false ]; then printf ",\n" >> posts/index.json; fi
                printf '  "%s"' "$file" >> posts/index.json
                first=false
              done <<< "$files"
              printf "\n]\n" >> posts/index.json
            fi
          else
            echo $files | jq -R -s -c 'split("\n") | map(select(. != ""))' > posts/index.json
          fi

          echo "Generated posts/index.json:"
          cat posts/index.json

      - name: Commit and push changes
        if: steps.generate-json.outcome == 'success'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add posts/index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: Auto-update posts index [skip ci]"
            git push
          else
            echo "No changes detected."
          fi
