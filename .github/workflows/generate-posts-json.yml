name: Update Posts Index

on:
  push:
    paths:
      - 'posts/*.md'
      - 'posts/*.markdown'
  workflow_dispatch:  # Allows manual triggering

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4  # Updated to latest version
    
    - name: Generate index
      run: |
        # Create directory if it doesn't exist
        mkdir -p posts
        
        # Generate JSON array of posts
        echo "[" > posts/index.json
        if ls -1 posts/*.md posts/*.markdown 2>/dev/null; then
          ls -1 posts/*.md posts/*.markdown 2>/dev/null | \
            sed 's/posts\///' | \
            awk 'NR>1 {printf ","} {printf "\"%s\"", $0}' >> posts/index.json
        fi
        echo "]" >> posts/index.json
        
        # Verify the generated file
        echo "Generated index:"
        cat posts/index.json
        
    - name: Commit changes
      if: success()
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add posts/index.json
        git diff-index --quiet HEAD || git commit -m "Update posts index"
        git push
