name: Generate Posts JSON Index

on:
  push:
    paths:
      - 'posts/*.md'
      - 'posts/*.markdown'
  workflow_dispatch:  # Manual trigger

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate git diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate JSON index
        id: generate-json
        run: |
          #!/bin/bash
          set -euo pipefail
          
          # Create posts directory if it doesn't exist
          mkdir -p posts
          
          # Find all markdown files and extract metadata
          echo "Generating posts index..."
          node -e "
            const fs = require('fs');
            const path = require('path');
            const postsDir = 'posts';
            
            const files = fs.readdirSync(postsDir)
              .filter(file => ['.md', '.markdown'].includes(path.extname(file).toLowerCase()))
              .sort((a, b) => {
                return fs.statSync(path.join(postsDir, b)).mtimeMs - fs.statSync(path.join(postsDir, a)).mtimeMs;
              });
            
            const index = files.map(file => {
              const content = fs.readFileSync(path.join(postsDir, file), 'utf8');
              const titleMatch = content.match(/^title:\s*(.*)$/mi);
              const dateMatch = content.match(/^date:\s*(.*)$/mi);
              
              return {
                file,
                title: titleMatch ? titleMatch[1].trim() : path.parse(file).name,
                date: dateMatch ? dateMatch[1].trim() : fs.statSync(path.join(postsDir, file)).mtime.toISOString(),
                url: \`/posts/\${path.parse(file).name}\`
              };
            });
            
            fs.writeFileSync(path.join(postsDir, 'index.json'), JSON.stringify(index, null, 2));
            console.log(\`Generated index with \${index.length} posts\`);
          "

      - name: Commit and push changes
        if: steps.generate-json.outcome == 'success'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add posts/index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: Auto-update posts index [skip ci]"
            git push
          else
            echo "No changes detected."
          fi
