name: Generate Posts Index

on:
  push:
    paths:
      - 'posts/*.md'
      - 'posts/*.markdown'

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Generate posts index
      run: |
        # Create JSON index of all posts
        echo "[" > posts/index.json
        ls -1 posts/*.md posts/*.markdown | \
          awk '{ printf "\"%s\"%s\n", $0, (NR==FNR ? "" : ",") }' | \
          sed 's/posts\///' >> posts/index.json
        echo "]" >> posts/index.json
        
        # Commit and push changes
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add posts/index.json
        git commit -m "Update posts index" || echo "No changes to commit"
        git push
