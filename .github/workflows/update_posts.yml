name: Update Posts Index

on:
  push:
    paths:
      - 'posts/*.md'
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create posts directory
      run: mkdir -p posts
      
    - name: Generate index
      run: |
        echo "Creating posts index..."
        files=$(find posts -name "*.md" | sort -r)
        
        if [ -z "$files" ]; then
          echo "[]" > posts/index.json
          echo "No posts found - created empty index"
        else
          echo "[" > posts/index.json
          echo "$files" | sed 's/posts\///' | \
            awk '{printf "\"%s\"%s\n", $0, (NR>1 ? "," : "")}' >> posts/index.json
          echo "]" >> posts/index.json
          echo "Created index with $(echo "$files" | wc -l) posts"
        fi
        
        echo "Index content:"
        cat posts/index.json
        
    - name: Commit changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add posts/index.json
        git diff --cached --quiet || git commit -m "Update posts index"
        git push
