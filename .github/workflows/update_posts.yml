name: Update Posts Index

on:
  push:
    paths:
      - 'posts/*.md'
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Generate index
      run: |
        # Create posts directory if it doesn't exist
        mkdir -p posts
        
        # Generate proper JSON array of posts
        echo "Generating posts index..."
        files=$(ls -1 posts/*.md 2>/dev/null || echo "")
        
        if [ -z "$files" ]; then
          echo "[]" > posts/index.json
          echo "No posts found, created empty index"
        else
          echo "[" > posts/index.json
          ls -1 posts/*.md | sed 's/posts\///' | \
            awk '{printf "\"%s\"%s\n", $0, (NR==FNR ? "" : ",")}' >> posts/index.json
          echo "]" >> posts/index.json
          echo "Index generated with $(ls -1 posts/*.md | wc -l) posts"
        fi
        
        cat posts/index.json
        
    - name: Commit changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add posts/index.json
        git diff --quiet && git diff --cached --quiet || git commit -m "Update posts index"
        git push
