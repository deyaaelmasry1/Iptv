name: Update Posts Index

on:
  push:
    paths:
      - 'posts/*.md'
  workflow_dispatch:  # Manual trigger option

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures full Git history for accurate diff checks

      - name: Generate posts index
        id: generate-index
        run: |
          set -euo pipefail  # Strict error handling
          mkdir -p posts  # Ensure directory exists

          # Find all .md files, sort newest first, and strip 'posts/' prefix
          files=$(find posts -type f -name '*.md' -printf "%f\n" | sort -r)

          # Generate JSON array (properly formatted)
          if [ -z "$files" ]; then
            echo "[]" > posts/index.json
            echo "No posts found. Created empty index."
          else
            # Use jq if available (pre-installed on GitHub runners), otherwise fallback to awk
            if command -v jq >/dev/null 2>&1; then
              echo "$files" | jq -R -s 'split("\n") | map(select(. != ""))' > posts/index.json
            else
              echo "[" > posts/index.json
              echo "$files" | awk '{printf "  \"%s\"%s\n", $0, (NR==1 ? "" : ",")}' >> posts/index.json
              echo "]" >> posts/index.json
            fi
            echo "Generated index with $(echo "$files" | wc -l) posts."
          fi

          # Display generated content for logs
          echo "Generated posts/index.json:"
          cat posts/index.json

      - name: Commit and push changes
        if: steps.generate-index.outcome == 'success'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add posts/index.json
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: Auto-update posts index [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
