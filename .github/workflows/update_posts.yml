name: Update Posts Index

on:
  push:
    paths:
      - 'posts/*.md'
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create posts directory
      run: mkdir -p posts
      
    - name: Generate index
      run: |
        echo "Creating posts index..."
        files=$(find posts -name "*.md" | sort -r)
        
        if [ -z "$files" ]; then
          echo "[]" > posts/index.json
        else
          echo "[" > posts/index.json
          first=true
          for f in $files; do
            name=$(basename "$f")
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> posts/index.json
            fi
            echo "\"$name\"" >> posts/index.json
          done
          echo "]" >> posts/index.json
        fi
        
    - name: Commit changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add posts/index.json
        git diff --cached --quiet || git commit -m "Update posts index"
        git push
