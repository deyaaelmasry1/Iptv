<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; }
        textarea { height: 300px; }
        .btn { padding: 8px 15px; margin-right: 10px; text-decoration: none; border-radius: 3px; }
        .btn-save { background-color: #4CAF50; color: white; }
        .btn-cancel { background-color: #ccc; color: black; }
    </style>
</head>
<body>
    <h1 id="formTitle">New Post</h1>
    
    <form id="postForm">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>
        </div>
        
        <div class="form-group">
            <label for="slug">Slug (URL-friendly)</label>
            <input type="text" id="slug" name="slug" required>
        </div>
        
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" required></textarea>
        </div>
        
        <div class="form-group">
            <button type="submit" class="btn btn-save">Save</button>
            <a href="index.html" class="btn btn-cancel">Cancel</a>
        </div>
    </form>

    <script>
        // Check if we're editing an existing post
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        
        if (slug) {
            document.getElementById('formTitle').textContent = 'Edit Post';
            
            // Load existing post data
            fetch(`../../posts/${slug}.json`)
                .then(response => response.json())
                .then(post => {
                    document.getElementById('title').value = post.title;
                    document.getElementById('slug').value = post.slug;
                    document.getElementById('content').value = post.content;
                })
                .catch(error => console.error('Error loading post:', error));
        }
        
        // Form submission
        document.getElementById('postForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const postData = {
                title: document.getElementById('title').value,
                slug: document.getElementById('slug').value,
                content: document.getElementById('content').value,
                date: new Date().toISOString()
            };
            
            // Save the post
            savePost(postData, slug);
        });
        
        function savePost(postData, originalSlug) {
            // First save the post content
            fetch(`../../posts/${postData.slug}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(postData)
            })
            .then(() => {
                // Then update the posts list
                return fetch('index.json')
                    .then(response => response.json())
                    .then(posts => {
                        let updatedPosts;
                        
                        if (originalSlug && originalSlug !== postData.slug) {
                            // If slug changed, remove old entry
                            updatedPosts = posts.filter(p => p.slug !== originalSlug);
                        } else if (!originalSlug) {
                            // New post
                            updatedPosts = [...posts];
                        } else {
                            // Existing post, same slug
                            updatedPosts = posts.map(p => 
                                p.slug === postData.slug ? postData : p
                            );
                            return fetch('index.json', {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(updatedPosts)
                            });
                        }
                        
                        // Add new post
                        updatedPosts.push(postData);
                        
                        return fetch('index.json', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(updatedPosts)
                        });
                    });
            })
            .then(() => {
                alert('Post saved successfully');
                window.location.href = 'index.html';
            })
            .catch(error => console.error('Error saving post:', error));
        }
    </script>
</body>
</html>
