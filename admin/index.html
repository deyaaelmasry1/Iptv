<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="/Iptv/css/tailwind.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <div class="bg-white rounded-lg shadow p-6 max-w-4xl mx-auto">
      <h1 class="text-2xl font-bold mb-6">Create New Post</h1>
      
      <form id="post-form">
        <div class="mb-4">
          <label class="block text-gray-700 mb-2">Title</label>
          <input type="text" id="post-title" class="w-full p-2 border rounded" required>
        </div>
        
        <div class="mb-4">
          <label class="block text-gray-700 mb-2">Content</label>
          <textarea id="post-content" rows="12" class="w-full p-2 border rounded" required></textarea>
          <p class="text-sm text-gray-500 mt-1">Markdown formatting supported</p>
        </div>
        
        <div class="flex items-center space-x-3">
          <button type="submit" id="submit-btn" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
            Publish Post
          </button>
          <div id="status-message" class="text-sm"></div>
        </div>
      </form>
    </div>
  </div>

  <script src="/Iptv/js/github-api.js"></script>
  <script src="/Iptv/js/admin.js"></script>
</body>
</html>
