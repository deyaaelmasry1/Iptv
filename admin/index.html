<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Post</title>
  <link href="/Iptv/css/tailwind.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded shadow-md w-full max-w-lg">
    <h1 class="text-2xl font-bold mb-4">New Blog Post</h1>
    <form id="post-form" class="space-y-4">
      <input type="text" id="post-title" placeholder="Post Title" required class="w-full p-2 border rounded">
      <textarea id="post-content" placeholder="Post Content (Markdown supported)" rows="10" required class="w-full p-2 border rounded"></textarea>
      <button id="submit-btn" class="bg-blue-600 text-white px-4 py-2 rounded">Publish</button>
      <p id="status-message" class="text-sm mt-2"></p>
    </form>
  </div>

  <script src="/Iptv/js/github-api.js"></script>
  <script src="/Iptv/js/admin.js"></script>
</body>
</html>
