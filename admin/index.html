<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="/Iptv/css/tailwind.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <div class="bg-white rounded-lg shadow p-6 max-w-4xl mx-auto">
      <h1 class="text-2xl font-bold mb-6">Create New Post</h1>
      
      <form id="post-form">
        <div class="mb-4">
          <label class="block text-gray-700 mb-2">Title *</label>
          <input type="text" id="post-title" class="w-full p-2 border rounded" required>
        </div>
        
        <div class="mb-4">
          <label class="block text-gray-700 mb-2">Content *</label>
          <textarea id="post-content" rows="12" class="w-full p-2 border rounded font-mono" required></textarea>
          <p class="text-sm text-gray-500 mt-1">Markdown formatting supported</p>
        </div>
        
        <div class="flex items-center space-x-3">
          <button type="submit" id="submit-btn" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
            Publish Post
          </button>
          <div id="status-message" class="text-sm min-w-[200px]"></div>
        </div>
      </form>
    </div>
  </div>

  <script src="/Iptv/js/github-api.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const postForm = document.getElementById('post-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMessage = document.getElementById('status-message');
    const cms = new GitHubCMS();

    // Prevent default form submission
    postForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      
      const title = document.getElementById('post-title').value.trim();
      const content = document.getElementById('post-content').value.trim();
      
      if (!title || !content) {
        showStatus('Please fill in all fields', 'red');
        return;
      }

      submitBtn.disabled = true;
      showStatus('Creating post...', 'blue');

      try {
        const result = await cms.createPost(title, content);
        if (result && result.content) {
          showStatus('✓ Post created successfully!', 'green');
          postForm.reset();
          
          // Optional: Show link to view post
          const postUrl = result.content.path.replace('.md', '');
          showStatus(`✓ Created! <a href="/Iptv/post/${postUrl}.html" class="underline">View post</a>`, 'green');
          
          // Refresh posts after delay
          setTimeout(() => {
            showStatus('Updating posts list...', 'blue');
          }, 2000);
        } else {
          throw new Error('Invalid response from GitHub');
        }
      } catch (error) {
        console.error('Post creation failed:', error);
        showStatus(`Error: ${error.message}`, 'red');
      } finally {
        submitBtn.disabled = false;
      }
    });

    function showStatus(message, color) {
      statusMessage.innerHTML = message;
      statusMessage.className = `text-sm text-${color}-500`;
    }
  });
  </script>
</body>
</html>
