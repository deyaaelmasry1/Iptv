<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="/Iptv/css/tailwind.css" rel="stylesheet">
  <style>
    .success-message {
      animation: fadeOut 5s forwards;
    }
    @keyframes fadeOut {
      0% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; display: none; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <!-- Success Message Container (initially hidden) -->
    <div id="success-message" class="hidden fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg success-message">
      Post created successfully! <span class="font-bold">✓</span>
    </div>

    <div class="bg-white rounded-lg shadow p-6 max-w-4xl mx-auto">
      <h1 class="text-2xl font-bold mb-6">Create New Post</h1>
      
      <form id="post-form">
        <div class="mb-4">
          <label class="block text-gray-700 mb-2">Title *</label>
          <input type="text" id="post-title" class="w-full p-2 border rounded" required>
        </div>
        
        <div class="mb-4">
          <label class="block text-gray-700 mb-2">Content *</label>
          <textarea id="post-content" rows="12" class="w-full p-2 border rounded font-mono" required></textarea>
          <p class="text-sm text-gray-500 mt-1">Markdown formatting supported</p>
        </div>
        
        <div class="flex items-center space-x-3">
          <button type="submit" id="submit-btn" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition-colors">
            Publish Post
          </button>
          <div id="status-message" class="text-sm min-w-[200px]"></div>
        </div>
      </form>
    </div>
  </div>

  <script src="/Iptv/js/github-api.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const postForm = document.getElementById('post-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMessage = document.getElementById('status-message');
    const successMessage = document.getElementById('success-message');
    const cms = new GitHubCMS();

    postForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const title = document.getElementById('post-title').value.trim();
      const content = document.getElementById('post-content').value.trim();
      
      if (!title || !content) {
        showStatus('Please fill in all fields', 'red');
        return;
      }

      submitBtn.disabled = true;
      showStatus('Creating post...', 'blue');

      try {
        const result = await cms.createPost(title, content);
        
        if (result && result.content) {
          // Show persistent status
          showStatus('Post created! Updating index...', 'green');
          
          // Show floating success message
          successMessage.classList.remove('hidden');
          setTimeout(() => {
            successMessage.classList.add('hidden');
          }, 5000);
          
          // Reset form but keep title for convenience
          document.getElementById('post-content').value = '';
          document.getElementById('post-title').focus();
          
          // Optional: Auto-scroll to show message
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      } catch (error) {
        console.error('Post creation failed:', error);
        showStatus(`Error: ${error.message}`, 'red');
      } finally {
        submitBtn.disabled = false;
      }
    });

    function showStatus(message, color) {
      statusMessage.textContent = message;
      statusMessage.className = `text-sm text-${color}-500 min-w-[200px]`;
    }
  });
  </script>
</body>
</html>
