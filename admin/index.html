<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="/Iptv/css/tailwind.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
  <!-- Admin-specific header -->
  <header class="bg-blue-600 text-white p-4 shadow">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">Admin Dashboard</h1>
      <nav>
        <a href="/Iptv/" class="text-white hover:text-blue-200 ml-4">View Site</a>
      </nav>
    </div>
  </header>

  <!-- Admin content -->
  <main class="container mx-auto p-4 mt-6">
    <div class="bg-white rounded-lg shadow p-6">
      <h2 class="text-xl font-semibold mb-4">Create New Post</h2>
      <form id="post-form">
        <div class="mb-4">
          <label class="block text-gray-700 mb-2">Title</label>
          <input type="text" id="post-title" class="w-full p-2 border rounded" required>
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 mb-2">Content (Markdown)</label>
          <textarea id="post-content" rows="10" class="w-full p-2 border rounded font-mono" required></textarea>
        </div>
        <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
          Publish Post
        </button>
      </form>
    </div>
  </main>

  <!-- Load scripts with correct paths -->
  <script src="/Iptv/js/marked.js"></script>
  <script src="/Iptv/js/github-api.js"></script>
  <script src="/Iptv/js/admin.js"></script>
  
  <!-- Verify admin access -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const config = JSON.parse(localStorage.getItem('github-cms-config'));
      if (!config?.token) {
        window.location.href = '/Iptv/setup.html';
      }
    });
  </script>
</body>
</html>
