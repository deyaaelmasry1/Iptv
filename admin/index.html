<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="/css/tailwind.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="app">
    <!-- Header will be injected here -->
    <div class="container mx-auto px-4 py-8">
      <div class="flex flex-col md:flex-row gap-6">
        <!-- Sidebar -->
        <div class="md:w-1/4">
          <div class="bg-white rounded-lg shadow p-4 sticky top-4">
            <h2 class="text-lg font-semibold mb-4">Dashboard</h2>
            <nav>
              <ul class="space-y-2">
                <li>
                  <a href="#" class="block px-3 py-2 text-blue-600 bg-blue-50 rounded font-medium">New Post</a>
                </li>
                <li>
                  <a href="#" class="block px-3 py-2 text-gray-600 hover:bg-gray-50 rounded">All Posts</a>
                </li>
                <li>
                  <a href="#" class="block px-3 py-2 text-gray-600 hover:bg-gray-50 rounded">Settings</a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
        
        <!-- Main Content -->
        <div class="md:w-3/4">
          <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h1 class="text-2xl font-bold mb-6">Create New Post</h1>
            <form id="post-form">
              <div class="mb-4">
                <label class="block text-gray-700 mb-2">Title</label>
                <input type="text" id="post-title" class="w-full p-2 border rounded" required>
              </div>
              <div class="mb-4">
                <label class="block text-gray-700 mb-2">Content</label>
                <textarea id="post-content" rows="12" class="w-full p-2 border rounded font-mono" required></textarea>
                <p class="text-sm text-gray-500 mt-1">Markdown formatting supported</p>
              </div>
              <div class="flex justify-end space-x-3">
                <button type="button" id="preview-btn" class="px-4 py-2 border rounded text-gray-700 hover:bg-gray-50">
                  Preview
                </button>
                <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                  Publish Post
                </button>
              </div>
            </form>
          </div>
          
          <!-- Preview Panel -->
          <div id="preview-panel" class="bg-white rounded-lg shadow p-6 hidden">
            <div class="flex justify-between items-center mb-4">
              <h2 class="text-xl font-bold">Preview</h2>
              <button id="close-preview" class="text-gray-500 hover:text-gray-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
              </button>
            </div>
            <div id="post-preview" class="prose max-w-none"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- Footer will be injected here -->
  </div>

  <script src="/js/marked.js"></script>
  <script src="/js/github-api.js"></script>
  <script src="/js/theme-manager.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    // Check if setup is needed
    if (!localStorage.getItem('github-cms-config')) {
      window.location.href = '/setup.html';
    }
    
    // Load admin theme
    const theme = new ThemeManager();
    theme.renderFullPage();
  </script>
</body>
</html>
