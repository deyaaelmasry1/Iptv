<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - GitHub CMS</title>
  <link href="/Iptv/css/tailwind.css" rel="stylesheet">
  <style>
    .status-message {
      transition: all 0.3s ease;
    }
    .pulse {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <!-- Success Message Toast -->
    <div id="success-toast" class="hidden fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50">
      <div class="flex items-center">
        <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span>Post created successfully!</span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
      <div class="p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Create New Post</h1>
        <p class="text-gray-600 mb-6">Add content to your GitHub-hosted blog</p>
        
        <form id="post-form" class="space-y-6">
          <div>
            <label for="post-title" class="block text-sm font-medium text-gray-700 mb-1">Post Title *</label>
            <input type="text" id="post-title" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>
          
          <div>
            <label for="post-content" class="block text-sm font-medium text-gray-700 mb-1">Content *</label>
            <textarea id="post-content" rows="12" required
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
            <p class="mt-1 text-sm text-gray-500">Markdown formatting supported</p>
          </div>
          
          <div class="flex items-center">
            <button type="submit" id="submit-btn"
                    class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
              Publish Post
            </button>
            <div id="status-message" class="ml-4 status-message text-sm"></div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/Iptv/js/github-api.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const postForm = document.getElementById('post-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMessage = document.getElementById('status-message');
    const successToast = document.getElementById('success-toast');
    const cms = new GitHubCMS();

    postForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const title = document.getElementById('post-title').value.trim();
      const content = document.getElementById('post-content').value.trim();
      
      // Validation
      if (!title || !content) {
        showStatus('Please fill in all required fields', 'red');
        return;
      }

      // Disable button and show loading state
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <span class="flex items-center">
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Publishing...
        </span>
      `;
      showStatus('Creating your post...', 'blue pulse');

      try {
        // Create post via GitHub API
        const result = await cms.createPost(title, content);
        
        if (result.success) {
          // Show success feedback
          showStatus('Post created successfully!', 'green');
          showSuccessToast();
          
          // Reset form but keep title for convenience
          document.getElementById('post-content').value = '';
          document.getElementById('post-title').focus();
          
          // Open GitHub to verify (after delay)
          setTimeout(() => {
            window.open(result.url, '_blank');
          }, 1500);
        }
      } catch (error) {
        console.error('Post creation failed:', error);
        showStatus(`Error: ${error.message}`, 'red');
      } finally {
        // Reset button state
        submitBtn.disabled = false;
        submitBtn.textContent = 'Publish Post';
      }
    });

    function showStatus(message, color) {
      statusMessage.textContent = message;
      statusMessage.className = `status-message text-sm font-medium text-${color}-600`;
      
      if (color === 'pulse') {
        statusMessage.classList.add('pulse');
      } else {
        statusMessage.classList.remove('pulse');
      }
    }

    function showSuccessToast() {
      successToast.classList.remove('hidden');
      setTimeout(() => {
        successToast.classList.add('hidden');
      }, 5000);
    }
  });
  </script>
</body>
</html>
