<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - GitHub CMS</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .status-message { transition: all 0.3s ease; }
    .pulse { animation: pulse 1.5s infinite; }
    @keyframes pulse { 
      0% { opacity: 0.6; } 
      50% { opacity: 1; } 
      100% { opacity: 0.6; } 
    }
    [aria-invalid="true"] {
      border-color: #f87171 !important;
      box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.2);
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <!-- Success Toast Notification -->
    <div id="success-toast" class="hidden fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 transition-all duration-300 transform translate-x-full">
      <div class="flex items-center">
        <i class="fas fa-check-circle mr-2"></i>
        <span>Post created successfully!</span>
      </div>
    </div>

    <!-- Error Toast Notification -->
    <div id="error-toast" class="hidden fixed top-4 right-4 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 transition-all duration-300 transform translate-x-full">
      <div class="flex items-center">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span id="error-message"></span>
      </div>
    </div>

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
      <div class="p-8">
        <header class="mb-8">
          <h1 class="text-3xl font-bold text-gray-800 mb-2">Create New Post</h1>
          <p class="text-gray-600">Add content to your GitHub-hosted blog</p>
        </header>
        
        <form id="post-form" class="space-y-6" novalidate>
          <div>
            <label for="post-title" class="block text-sm font-medium text-gray-700 mb-1">
              Post Title <span class="text-red-500">*</span>
            </label>
            <input type="text" id="post-title" required aria-required="true"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                   placeholder="Enter post title">
            <div id="title-error" class="mt-1 text-sm text-red-600 hidden"></div>
          </div>
          
          <div>
            <label for="post-content" class="block text-sm font-medium text-gray-700 mb-1">
              Content <span class="text-red-500">*</span>
            </label>
            <textarea id="post-content" rows="12" required aria-required="true"
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                      placeholder="Write your content in Markdown..."></textarea>
            <div id="content-error" class="mt-1 text-sm text-red-600 hidden"></div>
            <p class="mt-1 text-sm text-gray-500">
              <i class="fab fa-markdown mr-1"></i> Markdown formatting supported
            </p>
          </div>
          
          <div class="flex flex-col sm:flex-row sm:items-center gap-4">
            <button type="submit" id="submit-btn"
                    class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors flex items-center justify-center min-w-[150px]">
              <span id="button-text">Publish Post</span>
              <span id="spinner" class="hidden ml-2">
                <i class="fas fa-spinner fa-spin"></i>
              </span>
            </button>
            <div id="status-message" class="status-message text-sm"></div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="github-api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const postForm = document.getElementById('post-form');
      const submitBtn = document.getElementById('submit-btn');
      const buttonText = document.getElementById('button-text');
      const spinner = document.getElementById('spinner');
      const statusMessage = document.getElementById('status-message');
      const successToast = document.getElementById('success-toast');
      const errorToast = document.getElementById('error-toast');
      const errorMessage = document.getElementById('error-message');
      const titleError = document.getElementById('title-error');
      const contentError = document.getElementById('content-error');
      const cms = new GitHubCMS();

      // Form validation
      postForm.addEventListener('input', (e) => {
        const target = e.target;
        if (target.id === 'post-title' || target.id === 'post-content') {
          target.setAttribute('aria-invalid', !target.value.trim());
          if (target.id === 'post-title') {
            titleError.classList.add('hidden');
          } else {
            contentError.classList.add('hidden');
          }
        }
      });

      postForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const title = document.getElementById('post-title').value.trim();
        const content = document.getElementById('post-content').value.trim();
        
        // Validate form
        let isValid = true;
        
        if (!title) {
          document.getElementById('post-title').setAttribute('aria-invalid', 'true');
          titleError.textContent = 'Please enter a title';
          titleError.classList.remove('hidden');
          isValid = false;
        }
        
        if (!content) {
          document.getElementById('post-content').setAttribute('aria-invalid', 'true');
          contentError.textContent = 'Please enter content';
          contentError.classList.remove('hidden');
          isValid = false;
        }
        
        if (!isValid) {
          showError('Please fill in all required fields');
          return;
        }

        // Disable form during submission
        submitBtn.disabled = true;
        buttonText.textContent = 'Publishing...';
        spinner.classList.remove('hidden');
        showStatus('Creating your post...', 'blue pulse');

        try {
          const result = await cms.createPost(title, content);
          if (result.success) {
            showStatus('Post created successfully!', 'green');
            showSuccessToast();
            postForm.reset();
            document.getElementById('post-title').focus();
            setTimeout(() => {
              if (result.url) window.open(result.url, '_blank');
            }, 1500);
          } else {
            throw new Error(result.message || 'Failed to create post');
          }
        } catch (error) {
          console.error('Post creation failed:', error);
          showError(error.message || 'An unexpected error occurred');
          showStatus(`Error: ${error.message}`, 'red');
        } finally {
          submitBtn.disabled = false;
          buttonText.textContent = 'Publish Post';
          spinner.classList.add('hidden');
        }
      });

      function showStatus(message, color) {
        statusMessage.textContent = message;
        statusMessage.className = `status-message text-sm font-medium text-${color}-600`;
        if (color.includes('pulse')) {
          statusMessage.classList.add('pulse');
        } else {
          statusMessage.classList.remove('pulse');
        }
      }

      function showSuccessToast() {
        successToast.classList.remove('hidden');
        successToast.classList.remove('translate-x-full');
        setTimeout(() => {
          successToast.classList.add('translate-x-full');
          setTimeout(() => successToast.classList.add('hidden'), 300);
        }, 5000);
      }

      function showError(message) {
        errorMessage.textContent = message;
        errorToast.classList.remove('hidden');
        errorToast.classList.remove('translate-x-full');
        setTimeout(() => {
          errorToast.classList.add('translate-x-full');
          setTimeout(() => errorToast.classList.add('hidden'), 300);
        }, 5000);
      }
    });
  </script>
</body>
</html>
