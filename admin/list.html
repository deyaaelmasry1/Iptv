<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Posts Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .post-item { padding: 10px; border-bottom: 1px solid #eee; }
        .post-item:hover { background: #f5f5f5; }
        button { margin-left: 10px; cursor: pointer; }
        #debug { background: #f5f5f5; padding: 10px; margin-top: 20px; }
        #loading { color: #666; }
        #error { color: red; }
    </style>
</head>
<body>
    <h1>Manage Posts</h1>
    <div id="loading">Loading posts...</div>
    <div id="error"></div>
    <div id="postList"></div>
    <div id="debug">
        <h3>Debug Information</h3>
        <div id="debugInfo"></div>
    </div>

    <script>
        async function loadPosts() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const postList = document.getElementById('postList');
            const debugInfo = document.getElementById('debugInfo');
            
            loading.textContent = "Loading posts...";
            error.textContent = "";
            postList.innerHTML = "";
            debugInfo.innerHTML = "";

            try {
                // 1. First try to load index.json
                const indexUrl = '../posts/index.json';
                debugInfo.innerHTML += `<p>Fetching: ${indexUrl}</p>`;
                
                const response = await fetch(indexUrl);
                debugInfo.innerHTML += `<p>Response status: ${response.status}</p>`;
                
                if (!response.ok) {
                    throw new Error(`Failed to load index.json (status: ${response.status})`);
                }

                const data = await response.json();
                debugInfo.innerHTML += `<p>Data received: ${JSON.stringify(data).substring(0, 100)}...</p>`;
                
                // Handle both array and object formats
                let posts = [];
                if (Array.isArray(data)) {
                    posts = data;
                    debugInfo.innerHTML += `<p>Found array format with ${data.length} posts</p>`;
                } else if (data.posts && Array.isArray(data.posts)) {
                    posts = data.posts;
                    debugInfo.innerHTML += `<p>Found posts array with ${data.posts.length} items</p>`;
                } else {
                    throw new Error("Unknown JSON format - expected array or {posts: array}");
                }

                // Filter only .md files
                const mdPosts = posts.filter(post => post.file && post.file.endsWith('.md'));
                debugInfo.innerHTML += `<p>Found ${mdPosts.length} Markdown posts</p>`;
                
                if (mdPosts.length === 0) {
                    postList.innerHTML = '<p>No Markdown posts found.</p>';
                    loading.style.display = 'none';
                    return;
                }

                // Display posts
                postList.innerHTML = mdPosts.map(post => `
                    <div class="post-item">
                        <strong>${post.title || post.file.replace('.md', '')}</strong>
                        <span style="color:#666; margin-left:10px;">
                            ${post.date ? new Date(post.date).toLocaleDateString() : ''}
                        </span>
                        <button onclick="editPost('${post.file}')">Edit</button>
                        <button onclick="deletePost('${post.file}')">Delete</button>
                    </div>
                `).join('');

                loading.style.display = 'none';
                
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = `Error: ${err.message}`;
                debugInfo.innerHTML += `<p style="color:red">Error: ${err.message}</p>`;
                console.error('Failed to load posts:', err);
                
                // Try fallback method
                try {
                    debugInfo.innerHTML += `<p>Trying fallback directory listing...</p>`;
                    const dirResponse = await fetch('../posts/');
                    const html = await dirResponse.text();
                    
                    // Parse directory listing
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const links = Array.from(doc.querySelectorAll('a'))
                        .map(a => a.getAttribute('href'))
                        .filter(href => href.endsWith('.md'));
                    
                    debugInfo.innerHTML += `<p>Found ${links.length} .md files in directory</p>`;
                    
                    if (links.length > 0) {
                        postList.innerHTML = links.map(file => `
                            <div class="post-item">
                                <strong>${file.replace('.md', '')}</strong>
                                <button onclick="editPost('${file}')">Edit</button>
                                <button onclick="deletePost('${file}')">Delete</button>
                            </div>
                        `).join('');
                    }
                } catch (dirErr) {
                    debugInfo.innerHTML += `<p style="color:red">Directory fallback failed: ${dirErr.message}</p>`;
                }
            }
        }

        function editPost(filename) {
            window.location.href = `index.html?edit=${encodeURIComponent(filename)}`;
        }

        async function deletePost(filename) {
            if (!confirm(`Delete "${filename}" permanently?`)) return;
            alert('Delete would be implemented here');
            // Refresh after simulated delete
            loadPosts();
        }

        // Load posts on page load
        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>
</html>
