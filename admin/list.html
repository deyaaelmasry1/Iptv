    <script>

        async function deletePost(filename) {
            if (!confirm(`Are you sure you want to delete "${filename}"?`)) return;
            
            const statusDiv = document.getElementById('delete-status');
            statusDiv.textContent = "Deleting post...";
            statusDiv.className = "";
            
            try {
                // For GitHub Pages, we need to use the API
                const response = await fetch('https://api.github.com/repos/YOUR_USERNAME/YOUR_REPO/contents/posts/' + filename, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'token YOUR_GITHUB_TOKEN',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Delete ${filename}`,
                        sha: await getFileSHA(filename)
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message);
                }
                
                statusDiv.textContent = `Post "${filename}" deleted successfully`;
                statusDiv.className = "success";
                
                // Update index.json
                await updateIndexJson(filename, 'delete');
                
                // Refresh the list
                loadPosts();
                
            } catch (error) {
                statusDiv.textContent = `Error deleting post: ${error.message}`;
                statusDiv.className = "error";
                console.error('Delete error:', error);
            }
        }

        async function getFileSHA(filename) {
            const response = await fetch('https://api.github.com/repos/YOUR_USERNAME/YOUR_REPO/contents/posts/' + filename);
            const data = await response.json();
            return data.sha;
        }
