<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Posts Management</title>
    <style>
        .post-item { padding: 10px; border-bottom: 1px solid #eee; margin: 5px 0; }
        .post-item:hover { background: #f5f5f5; }
        button { margin-left: 10px; padding: 5px 10px; }
        #loading, #error { margin: 10px 0; padding: 10px; }
        #loading { background: #f0f0f0; }
        #error { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <h1>Manage Posts</h1>
    <div id="loading">Loading posts...</div>
    <div id="error"></div>
    <div id="postList"></div>

    <script>
        async function loadPosts() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const postList = document.getElementById('postList');
            
            loading.textContent = "Loading posts...";
            error.textContent = "";
            postList.innerHTML = "";

            try {
                // Load index.json
                const response = await fetch('../posts/index.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Handle both array and object formats
                let postsArray = [];
                
                if (Array.isArray(data)) {
                    // If the JSON is directly an array of posts
                    postsArray = data;
                } else if (data.posts && Array.isArray(data.posts)) {
                    // If the JSON has a posts array
                    postsArray = data.posts;
                } else if (data.file) {
                    // If it's a single post object
                    postsArray = [data];
                } else {
                    throw new Error("Unknown JSON format");
                }
                
                // Filter only .md files
                const mdPosts = postsArray.filter(post => 
                    post.file && post.file.endsWith('.md')
                );
                
                loading.style.display = 'none';
                
                if (mdPosts.length === 0) {
                    postList.innerHTML = '<p>No Markdown posts found.</p>';
                    return;
                }

                // Display posts
                postList.innerHTML = mdPosts.map(post => `
                    <div class="post-item">
                        <strong>${post.title || post.file.replace('.md', '')}</strong>
                        <span style="color:#666; font-size:0.9em; margin-left:10px;">
                            ${post.date ? new Date(post.date).toLocaleDateString() : ''}
                        </span>
                        <button onclick="editPost('${post.file}')">Edit</button>
                        <button onclick="deletePost('${post.file}')">Delete</button>
                    </div>
                `).join('');
                
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = `Error loading posts: ${err.message}`;
                console.error('Failed to load posts:', err);
            }
        }

        function editPost(filename) {
            window.location.href = `index.html?edit=${encodeURIComponent(filename)}`;
        }

        async function deletePost(filename) {
            if (!confirm(`Are you sure you want to delete "${filename}"?`)) return;
            
            try {
                // In a real implementation, this would call your API
                console.log('Would delete:', filename);
                
                // Simulate deletion
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Refresh the list
                loadPosts();
                alert('Post deleted successfully (simulated)');
            } catch (error) {
                alert(`Error deleting post: ${error.message}`);
            }
        }

        // Load posts when page loads
        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>
</html>
