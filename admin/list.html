<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Posts Management</title>
    <style>
        .post-item { padding: 10px; border-bottom: 1px solid #eee; }
        .post-item:hover { background: #f5f5f5; }
        button { margin-left: 10px; }
    </style>
</head>
<body>
    <h1>Manage Posts</h1>
    <div id="postList">
        <!-- Posts will be loaded here -->
    </div>

    <script src="admin.js"></script>
    <script>
        async function loadPosts() {
            const posts = await getPosts();
            const postList = document.getElementById('postList');
            
            if (posts.length === 0) {
                postList.innerHTML = '<p>No posts found.</p>';
                return;
            }

            postList.innerHTML = '';
            posts.forEach(post => {
                const div = document.createElement('div');
                div.className = 'post-item';
                div.innerHTML = `
                    <strong>${post.title}</strong>
                    <button onclick="editPost('${post.file}')">Edit</button>
                    <button onclick="deletePost('${post.file}')">Delete</button>
                `;
                postList.appendChild(div);
            });
        }

        function editPost(filename) {
            // Open editor page with the post filename
            window.location.href = `index.html?edit=${encodeURIComponent(filename)}`;
        }

        async function deletePost(filename) {
            if (!confirm(`Delete ${filename} permanently?`)) return;
            
            try {
                const response = await fetch(`../scripts/delete.js?file=${filename}`);
                const result = await response.json();
                
                if (result.success) {
                    alert('Post deleted successfully');
                    loadPosts(); // Refresh the list
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                alert(`Error deleting post: ${error.message}`);
            }
        }

        // Load posts when page loads
        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>
</html>
