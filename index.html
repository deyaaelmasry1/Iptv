<div id="posts-container">
  <!-- Loading state will be replaced -->
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const cms = new GitHubCMS();
  const container = document.getElementById('posts-container');
  
  try {
    container.innerHTML = `
      <div class="text-center py-8">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-gray-400 mx-auto"></div>
        <p class="mt-2 text-gray-500">Loading posts...</p>
      </div>
    `;
    
    const posts = await cms.getPosts();
    
    if (!posts || posts.length === 0) {
      container.innerHTML = `
        <div class="bg-yellow-50 p-4 rounded-lg text-center">
          <p>No posts yet. <a href="/Iptv/admin/" class="text-blue-600 hover:underline">Create your first post</a></p>
          <button onclick="location.reload()" class="mt-2 px-3 py-1 bg-gray-100 rounded">
            ↻ Refresh
          </button>
        </div>
      `;
      return;
    }
    
    // Render posts here...
    
  } catch (error) {
    container.innerHTML = `
      <div class="bg-red-50 p-4 rounded-lg">
        <p class="text-red-600">Error loading posts. Please try again later.</p>
        <button onclick="location.reload()" class="mt-2 px-3 py-1 bg-gray-100 rounded">
          ↻ Refresh
        </button>
      </div>
    `;
  }
});
</script>
