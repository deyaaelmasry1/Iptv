<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .loading-spinner {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="container mx-auto px-4 py-6">
      <h1 class="text-3xl font-bold text-gray-800">My Blog</h1>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">Latest Posts</h2>
        <p id="last-updated" class="text-sm text-gray-500 mt-1">Last updated: Loading...</p>
      </div>
      <div class="flex space-x-4">
        <a href="/admin/" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center">
          <i class="fas fa-plus mr-2"></i> New Post
        </a>
        <button id="refresh-posts" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-lg flex items-center">
          <i class="fas fa-sync-alt mr-2"></i> Refresh
        </button>
      </div>
    </div>

    <div id="posts-container" class="space-y-6">
      <div id="loading" class="text-center py-12">
        <div class="loading-spinner rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mx-auto"></div>
        <p class="mt-4 text-gray-500">Loading posts...</p>
      </div>
    </div>

    <div id="pagination-container" class="mt-8 flex justify-center space-x-2"></div>
  </main>

  <footer class="bg-white border-t mt-12 py-6">
    <div class="container mx-auto px-4 text-center text-gray-500">
      © 2023 My Blog. All rights reserved.
    </div>
  </footer>

  <script src="/js/github-api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const cms = new GitHubCMS();
      
      // Display posts function
      async function loadAndDisplayPosts() {
        try {
          const posts = await cms.getPosts();
          displayPosts(posts);
        } catch (error) {
          console.error('Error loading posts:', error);
          showError('Failed to load posts. Please try again.');
        }
      }

      function displayPosts(posts) {
        const postsContainer = document.getElementById('posts-container');
        
        if (!posts || posts.length === 0) {
          postsContainer.innerHTML = `
            <div class="bg-yellow-50 p-6 rounded-lg text-center">
              <i class="far fa-newspaper text-4xl text-yellow-400 mb-4"></i>
              <p class="text-lg mb-4">No posts found</p>
              <a href="/admin/" class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                <i class="fas fa-plus mr-2"></i> Create First Post
              </a>
            </div>
          `;
          return;
        }

        // Sort posts by date (newest first)
        const sortedPosts = posts.sort((a, b) => {
          const dateA = a.date ? new Date(a.date) : extractDateFromSlug(a.slug);
          const dateB = b.date ? new Date(b.date) : extractDateFromSlug(b.slug);
          return dateB - dateA;
        });

        postsContainer.innerHTML = sortedPosts.map(post => {
          const postDate = post.date ? new Date(post.date) : extractDateFromSlug(post.slug);
          const formattedDate = postDate.toLocaleDateString('en-US', { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
          });

          // Ensure we have a valid slug for the URL
          const postSlug = generateValidSlug(post.slug || post.title || 'untitled-post');
          const postUrl = `/posts/${postSlug}.html`;

          return `
            <article class="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow overflow-hidden">
              <a href="${postUrl}" class="block p-6">
                <div class="flex items-center text-sm text-gray-500 mb-2">
                  <i class="far fa-calendar-alt mr-2"></i>
                  ${formattedDate}
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-3">${post.title || 'Untitled Post'}</h3>
                ${post.excerpt ? `<p class="text-gray-600 mb-3">${post.excerpt}</p>` : ''}
                <div class="flex items-center text-blue-600 font-medium">
                  <span>Read post</span>
                  <i class="fas fa-arrow-right ml-2"></i>
                </div>
              </a>
            </article>
          `;
        }).join('');

        document.getElementById('last-updated').textContent = `Last updated: ${new Date().toLocaleString()}`;
      }

      function extractDateFromSlug(slug) {
        // Try to extract date from slug (format: YYYY-MM-DD-rest-of-slug)
        const dateMatch = slug?.match(/^(\d{4}-\d{2}-\d{2})/);
        return dateMatch ? new Date(dateMatch[1]) : new Date(0); // Default to epoch if no date found
      }

      function generateValidSlug(input) {
        if (!input) return 'untitled-post';
        
        // If already starts with date, keep it
        if (/^\d{4}-\d{2}-\d{2}/.test(input)) {
          return input;
        }
        
        // Otherwise add current date and convert to slug
        const today = new Date();
        const dateStr = today.toISOString().split('T')[0];
        
        // Convert to slug-friendly format
        const slugPart = input.toLowerCase()
          .replace(/[^\w\s-]/g, '') // Remove non-word chars
          .replace(/\s+/g, '-')    // Replace spaces with -
          .replace(/--+/g, '-');   // Replace multiple - with single -
        
        return `${dateStr}-${slugPart}`;
      }

      function showError(message) {
        const postsContainer = document.getElementById('posts-container');
        postsContainer.innerHTML = `
          <div class="bg-red-50 p-6 rounded-lg text-center">
            <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
            <p class="text-lg mb-4">${message}</p>
            <button onclick="window.location.reload()" class="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">
              <i class="fas fa-sync-alt mr-2"></i> Try Again
            </button>
          </div>
        `;
      }

      // Initial load
      loadAndDisplayPosts();

      // Refresh button functionality
      document.getElementById('refresh-posts').addEventListener('click', () => {
        const postsContainer = document.getElementById('posts-container');
        postsContainer.innerHTML = `
          <div class="text-center py-12">
            <div class="loading-spinner rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mx-auto"></div>
            <p class="mt-4 text-gray-500">Refreshing posts...</p>
          </div>
        `;
        
        loadAndDisplayPosts();
      });
    });
  </script>
</body>
</html>
