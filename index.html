<!DOCTYPE html>
<html>
<head>
  <title>My Blog</title>
  <link href="/themes/default/style.css" rel="stylesheet">
</head>
<body>
  <div id="header-container"></div>
  
  <main class="container mx-auto px-4 py-8 max-w-4xl">
    <h1 class="text-3xl font-bold mb-8">Latest Posts</h1>
    
    <div id="posts-container">
      <div class="text-center py-12">
        <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500 mx-auto"></div>
        <p class="mt-4 text-gray-500">Loading posts...</p>
      </div>
    </div>
  </main>
  
  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/js/github-api.js"></script>
  <script src="/js/theme-manager.js"></script>
  <script>
    const theme = new ThemeManager();
    const cms = new GitHubCMS();
    
    theme.renderFullPage('home', async () => {
      try {
        const posts = await cms.getPosts();
        const container = document.getElementById('posts-container');
        
        if (!posts.length) {
          container.innerHTML = `
            <div class="bg-yellow-50 p-4 rounded text-center">
              No posts yet. <a href="/admin/" class="text-blue-600 underline">Create one?</a>
            </div>
          `;
          return;
        }
        
        container.innerHTML = posts.map(post => `
          <article class="mb-8 bg-white p-6 rounded-lg shadow hover:shadow-md transition-shadow">
            <h2 class="text-xl font-bold mb-2">
              ${post.replace(/^\d{4}-\d{2}-\d{2}-|\.md$/g, '').replace(/-/g, ' ')}
            </h2>
            <a href="/post/${post.replace('.md', '.html')}" class="text-blue-600 hover:underline">
              Read post →
            </a>
          </article>
        `).join('');
      } catch (error) {
        document.getElementById('posts-container').innerHTML = `
          <div class="bg-red-50 p-4 rounded text-center">
            Error loading posts: ${error.message}
          </div>
        `;
      }
    });
  </script>
</body>
</html>
