<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog</title>
  <link href="/Iptv/css/tailwind.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <h1 class="text-3xl font-bold mb-8">Latest Posts</h1>
    <div id="posts-container">
      <p>Loading posts...</p>
    </div>
  </div>

  <script src="/Iptv/js/marked.js"></script>
  <script src="/Iptv/js/github-api.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', async () => {
    const cms = new GitHubCMS();
    const container = document.getElementById('posts-container');

    try {
      const posts = await cms.getPosts();
      if (!posts.length) {
        container.innerHTML = `<p>No posts yet. <a href="/Iptv/admin/">Create one</a></p>`;
        return;
      }

      container.innerHTML = '';
      for (const file of posts) {
        const res = await fetch(`https://raw.githubusercontent.com/deyaaelmasry1/Iptv/main/posts/${file}`);
        const text = await res.text();
        container.innerHTML += `
          <article class="mb-6 bg-white p-4 rounded shadow">
            <h2 class="text-xl font-bold">${file.replace(/^\d{4}-\d{2}-\d{2}-|\.md$/g, '').replace(/-/g, ' ')}</h2>
            <div class="prose">${marked.parse(text.substring(0, 200) + '...')}</div>
          </article>
        `;
      }
    } catch (err) {
      container.innerHTML = `<p class="text-red-500">Error loading posts</p>`;
    }
  });
  </script>
</body>
</html>
