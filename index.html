<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .loading-spinner {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="container mx-auto px-4 py-6">
      <h1 class="text-3xl font-bold text-gray-800">My Blog</h1>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">Latest Posts</h2>
        <p id="last-updated" class="text-sm text-gray-500 mt-1">Last updated: Loading...</p>
      </div>
      <div class="flex space-x-4">
        <a href="/admin/" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center">
          <i class="fas fa-plus mr-2"></i> New Post
        </a>
        <button id="refresh-posts" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-lg flex items-center">
          <i class="fas fa-sync-alt mr-2"></i> Refresh
        </button>
      </div>
    </div>

    <div id="posts-container" class="space-y-6">
      <div id="loading" class="text-center py-12">
        <div class="loading-spinner rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mx-auto"></div>
        <p class="mt-4 text-gray-500">Loading posts...</p>
      </div>
    </div>

    <div id="pagination-container" class="mt-8 flex justify-center space-x-2"></div>
  </main>

  <footer class="bg-white border-t mt-12 py-6">
    <div class="container mx-auto px-4 text-center text-gray-500">
      © 2023 My Blog. All rights reserved.
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Sample posts data - replace with your actual data fetching logic
      const samplePosts = [
        {
          title: "Getting Started with JavaScript",
          slug: "2023-11-15-getting-started-with-javascript",
          date: "2023-11-15",
          excerpt: "Learn the basics of JavaScript programming language."
        },
        {
          title: "CSS Tips and Tricks",
          slug: "2023-11-10-css-tips-and-tricks",
          date: "2023-11-10",
          excerpt: "Useful CSS techniques to improve your styling workflow."
        },
        {
          title: "Introduction to HTML5",
          slug: "2023-11-05-introduction-to-html5",
          date: "2023-11-05",
          excerpt: "Discover the new features of HTML5 specification."
        }
      ];

      // Display posts function
      function displayPosts(posts) {
        const postsContainer = document.getElementById('posts-container');
        
        if (posts.length === 0) {
          postsContainer.innerHTML = `
            <div class="bg-yellow-50 p-6 rounded-lg text-center">
              <i class="far fa-newspaper text-4xl text-yellow-400 mb-4"></i>
              <p class="text-lg mb-4">No posts found</p>
              <a href="/admin/" class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                <i class="fas fa-plus mr-2"></i> Create First Post
              </a>
            </div>
          `;
          return;
        }

        postsContainer.innerHTML = posts.map(post => `
          <article class="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow overflow-hidden">
            <a href="/posts/${post.slug}.html" class="block p-6">
              <div class="flex items-center text-sm text-gray-500 mb-2">
                <i class="far fa-calendar-alt mr-2"></i>
                ${new Date(post.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}
              </div>
              <h3 class="text-xl font-bold text-gray-800 mb-3">${post.title}</h3>
              ${post.excerpt ? `<p class="text-gray-600 mb-3">${post.excerpt}</p>` : ''}
              <div class="flex items-center text-blue-600 font-medium">
                <span>Read post</span>
                <i class="fas fa-arrow-right ml-2"></i>
              </div>
            </a>
          </article>
        `).join('');

        document.getElementById('last-updated').textContent = `Last updated: ${new Date().toLocaleString()}`;
      }

      // Simulate loading data
      setTimeout(() => {
        document.getElementById('loading').remove();
        displayPosts(samplePosts);
      }, 1000);

      // Refresh button functionality
      document.getElementById('refresh-posts').addEventListener('click', () => {
        const postsContainer = document.getElementById('posts-container');
        postsContainer.innerHTML = `
          <div class="text-center py-12">
            <div class="loading-spinner rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mx-auto"></div>
            <p class="mt-4 text-gray-500">Refreshing posts...</p>
          </div>
        `;
        
        setTimeout(() => {
          postsContainer.innerHTML = '';
          displayPosts(samplePosts);
        }, 800);
      });
    });
  </script>
</body>
</html>
