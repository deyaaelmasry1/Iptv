<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog</title>
  <!-- ABSOLUTE PATH for GitHub Pages -->
  <link href="/Iptv/css/tailwind.css" rel="stylesheet">
</head>
<body>
  <!-- Mandatory container with ID -->
  <div id="app" class="container mx-auto p-4">
    <h1 class="text-3xl font-bold mb-6">Latest Posts</h1>
    <div id="posts-container">
      <!-- Loading indicator -->
      <div class="text-center py-8">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-gray-400 mx-auto"></div>
        <p class="mt-2 text-gray-500">Loading posts...</p>
      </div>
    </div>
  </div>

  <!-- ABSOLUTE PATHS for JS -->
  <script src="/Iptv/js/marked.js"></script>
  <script src="/Iptv/js/github-api.js"></script>
  <script src="/Iptv/js/app.js"></script>
</body>
</html>
