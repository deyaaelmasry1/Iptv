<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Post | My Blog</title>
  <meta name="description" content="Blog post loading...">
  
  <!-- Preload critical resources -->
  <link rel="preload" href="/css/tailwind.css" as="style">
  <link rel="preload" href="/js/marked.js" as="script">
  <link rel="preload" href="/js/github-api.js" as="script">
  <link rel="preload" href="/js/theme-manager.js" as="script">
  
  <!-- CSS -->
  <link href="/css/tailwind.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
  <!-- Theme will inject header here -->
  <div id="header-container"></div>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-8 max-w-3xl">
    <!-- Back Button -->
    <div class="mb-6">
      <a href="/" class="inline-flex items-center text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors">
        <i class="fas fa-arrow-left mr-2"></i> Back to all posts
      </a>
    </div>

    <!-- Article Container -->
    <article class="bg-white dark:bg-gray-800 rounded-lg shadow-lg overflow-hidden">
      <!-- Loading State -->
      <div id="loading-state" class="p-8 text-center">
        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-blue-500 mx-auto"></div>
        <p class="mt-4 text-gray-500 dark:text-gray-400">Loading post content...</p>
      </div>

      <!-- Error State (Hidden by default) -->
      <div id="error-state" class="hidden p-8 text-center">
        <div class="bg-red-50 dark:bg-gray-700 inline-block p-4 rounded-full mb-4">
          <i class="fas fa-exclamation-triangle text-4xl text-red-500 dark:text-red-400"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">Post Loading Failed</h2>
        <p id="error-message" class="text-gray-600 dark:text-gray-300 mb-6"></p>
        <div class="flex justify-center gap-4">
          <a href="/" class="btn btn-secondary">
            <i class="fas fa-home mr-2"></i> Return Home
          </a>
          <button onclick="window.location.reload()" class="btn btn-primary">
            <i class="fas fa-sync-alt mr-2"></i> Try Again
          </button>
        </div>
      </div>

      <!-- Post Content (Hidden until loaded) -->
      <div id="post-content" class="hidden">
        <!-- Featured Image (Optional) -->
        <div id="featured-image" class="hidden h-64 bg-gray-200 dark:bg-gray-700"></div>

        <!-- Article Body -->
        <div class="p-6 md:p-8">
          <!-- Title -->
          <h1 id="post-title" class="text-3xl md:text-4xl font-bold mb-4 text-gray-800 dark:text-white"></h1>

          <!-- Meta Information -->
          <div id="post-meta" class="flex flex-wrap items-center text-gray-500 dark:text-gray-400 mb-6 gap-4">
            <div class="flex items-center">
              <i class="fas fa-calendar-day mr-2"></i>
              <span id="post-date"></span>
            </div>
            <div class="flex items-center">
              <i class="fas fa-clock mr-2"></i>
              <span id="reading-time"></span>
            </div>
          </div>

          <!-- Tags -->
          <div id="post-tags" class="flex flex-wrap gap-2 mb-8"></div>

          <!-- Content -->
          <div id="post-body" class="prose dark:prose-invert max-w-none"></div>
        </div>

        <!-- Author Bio (Optional) -->
        <div id="author-bio" class="hidden p-6 md:p-8 border-t border-gray-200 dark:border-gray-700">
          <div class="flex items-center">
            <img src="https://via.placeholder.com/64" alt="Author" class="w-12 h-12 rounded-full mr-4">
            <div>
              <h3 class="font-semibold text-gray-800 dark:text-white">About the Author</h3>
              <p class="text-gray-600 dark:text-gray-300 mt-1" id="author-description"></p>
            </div>
          </div>
        </div>

        <!-- Navigation -->
        <div class="px-6 md:px-8 py-4 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700">
          <div class="flex justify-between">
            <a id="prev-post" href="#" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors flex items-center">
              <i class="fas fa-arrow-left mr-2"></i>
              <span class="hidden md:inline">Previous Post</span>
            </a>
            <a id="next-post" href="#" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors flex items-center">
              <span class="hidden md:inline">Next Post</span>
              <i class="fas fa-arrow-right ml-2"></i>
            </a>
          </div>
        </div>
      </div>
    </article>

    <!-- Comments Section (Optional) -->
    <div id="comments-section" class="hidden mt-12 bg-white dark:bg-gray-800 rounded-lg shadow p-6">
      <h2 class="text-2xl font-bold mb-6 text-gray-800 dark:text-white">Comments</h2>
      <div class="text-center py-8">
        <p class="text-gray-500 dark:text-gray-400">Comments coming soon!</p>
      </div>
    </div>
  </main>

  <!-- Theme will inject footer here -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="/js/marked.js"></script>
  <script src="/js/github-api.js"></script>
  <script src="/js/theme-manager.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', async () => {
    // Initialize theme
    const theme = new ThemeManager();
    await theme.loadTemplates();
    theme.applyTemplate('header', 'header-container');
    theme.applyTemplate('footer', 'footer-container');

    // Initialize CMS
    const cms = new GitHubCMS();
    const postSlug = window.location.pathname.split('/post/')[1]?.replace('.html', '');
    
    if (!postSlug) {
      showError('Invalid post URL');
      return;
    }

    try {
      // Load post content
      const response = await fetch(`/posts/${postSlug}.md`);
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
      
      const markdown = await response.text();
      const { content, metadata } = parseMarkdown(markdown);

      // Calculate reading time (200 words per minute)
      const wordCount = content.split(/\s+/).length;
      const readingTime = Math.ceil(wordCount / 200);

      // Set post data
      document.title = `${metadata.title || formatTitle(postSlug)} | My Blog`;
      document.getElementById('post-title').textContent = metadata.title || formatTitle(postSlug);
      document.getElementById('post-date').textContent = metadata.date || formatDate(postSlug);
      document.getElementById('reading-time').textContent = `${readingTime} min read`;
      document.getElementById('post-body').innerHTML = marked.parse(content);

      // Handle tags
      if (metadata.tags) {
        const tagsContainer = document.getElementById('post-tags');
        metadata.tags.split(',').forEach(tag => {
          const tagElement = document.createElement('span');
          tagElement.className = 'px-3 py-1 text-sm rounded-full bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-100';
          tagElement.textContent = tag.trim();
          tagsContainer.appendChild(tagElement);
        });
      }

      // Handle author bio if available
      if (metadata.author) {
        document.getElementById('author-bio').classList.remove('hidden');
        document.getElementById('author-description').textContent = metadata.bio || 'The author of this post.';
      }

      // Show content
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('post-content').classList.remove('hidden');
      
      // Show comments section
      document.getElementById('comments-section').classList.remove('hidden');

    } catch (error) {
      console.error('Error loading post:', error);
      showError(error.message || 'Failed to load post content');
    }
  });

  function parseMarkdown(markdown) {
    // Simple front matter parser
    const metadata = {};
    let content = markdown;
    
    if (markdown.startsWith('---')) {
      const end = markdown.indexOf('---', 3);
      if (end > 0) {
        const frontmatter = markdown.substring(3, end);
        content = markdown.substring(end + 3).trim();
        
        frontmatter.split('\n').forEach(line => {
          const match = line.match(/^([a-z]+):\s*(.*)$/i);
          if (match) metadata[match[1].toLowerCase()] = match[2].trim();
        });
      }
    }
    
    return { content, metadata };
  }

  function formatTitle(slug) {
    return slug
      .replace(/^\d{4}-\d{2}-\d{2}-/, '')
      .replace(/-/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  function formatDate(slug) {
    const dateMatch = slug.match(/^(\d{4}-\d{2}-\d{2})/);
    if (dateMatch) {
      try {
        return new Date(dateMatch[1]).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
      } catch {
        return dateMatch[1];
      }
    }
    return 'Unknown date';
  }

  function showError(message) {
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('error-message').textContent = message;
    document.getElementById('error-state').classList.remove('hidden');
  }
  </script>
</body>
</html>
