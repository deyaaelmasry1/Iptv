<!DOCTYPE html>
<html>
<head>
  <title>Loading Post...</title>
  <link href="/themes/default/style.css" rel="stylesheet">
</head>
<body>
  <div id="header-container"></div>
  
  <main class="container mx-auto px-4 py-8 max-w-3xl">
    <div id="post-content">
      <div class="text-center py-12">
        <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500 mx-auto"></div>
        <p class="mt-4 text-gray-500">Loading post...</p>
      </div>
    </div>
  </main>
  
  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/js/github-api.js"></script>
  <script src="/js/theme-manager.js"></script>
  <script>
    const theme = new ThemeManager();
    const cms = new GitHubCMS();
    
    theme.renderFullPage('post', async () => {
      const slug = window.location.pathname.split('/post/')[1]?.replace('.html', '');
      if (!slug) return;
      
      try {
        const response = await fetch(
          `https://raw.githubusercontent.com/${cms.owner}/${cms.repo}/main/posts/${slug}.md`
        );
        const markdown = await response.text();
        
        document.getElementById('post-content').innerHTML = `
          <article class="bg-white p-6 rounded-lg shadow">
            <h1 class="text-3xl font-bold mb-4">
              ${slug.replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/-/g, ' ')}
            </h1>
            <div class="prose max-w-none">
              ${marked.parse(markdown)}
            </div>
          </article>
        `;
      } catch (error) {
        document.getElementById('post-content').innerHTML = `
          <div class="bg-red-50 p-4 rounded text-center">
            Error loading post: ${error.message}
          </div>
        `;
      }
    });
  </script>
</body>
</html>
