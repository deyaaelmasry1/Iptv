<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post View</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Header will be injected here -->
  <div id="header-container"></div>

  <main class="container mx-auto px-4 py-8 max-w-3xl">
    <div class="mb-6">
      <a href="/" class="inline-flex items-center text-blue-600 hover:text-blue-800">
        <i class="fas fa-arrow-left mr-2"></i> Back to all posts
      </a>
    </div>

    <div id="post-container">
      <!-- Loading State -->
      <div class="text-center py-12">
        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-blue-500 mx-auto"></div>
        <p class="mt-4 text-gray-500">Loading post content...</p>
      </div>
    </div>
  </main>

  <!-- Footer will be injected here -->
  <div id="footer-container"></div>

  <script src="/js/theme-manager.js"></script>
  <script src="/js/github-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const theme = new ThemeManager();
      await theme.loadTemplates();
      theme.applyTemplate('header', 'header-container');
      theme.applyTemplate('footer', 'footer-container');

      const cms = new GitHubCMS();
      const container = document.getElementById('post-container');
      
      // Extract slug from URL exactly as you specified
      const postSlug = window.location.pathname.split('/').pop().replace('.html', '');
      
      if (!postSlug) {
        container.innerHTML = `
          <div class="bg-red-50 p-6 rounded-lg">
            <p class="text-red-600">Invalid post URL</p>
            <a href="/" class="text-blue-600 hover:underline mt-2 inline-block">Go to homepage</a>
          </div>
        `;
        return;
      }

      try {
        // Build the raw GitHub URL exactly as you specified
        const postUrl = `https://raw.githubusercontent.com/${cms.owner}/${cms.repo}/main/posts/${postSlug}.md`;
        
        const response = await fetch(postUrl);
        
        if (!response.ok) throw new Error('Post not found');
        
        const markdown = await response.text();
        const title = postSlug
          .replace(/^\d{4}-\d{2}-\d{2}-/, '')
          .replace(/-/g, ' ')
          .replace(/\b\w/g, c => c.toUpperCase());
        
        document.title = `${title} | My Blog`;
        
        container.innerHTML = `
          <article class="bg-white rounded-lg shadow-lg overflow-hidden">
            <div class="p-6 md:p-8">
              <h1 class="text-3xl md:text-4xl font-bold mb-4">${title}</h1>
              <div class="flex items-center text-gray-500 mb-6">
                <i class="far fa-calendar mr-2"></i>
                ${postSlug.match(/^\d{4}-\d{2}-\d{2}/)?.[0] || ''}
              </div>
              <div class="prose max-w-none" id="post-content"></div>
            </div>
          </article>
        `;
        
        // Configure marked to handle relative links correctly
        marked.use({
          baseUrl: `/post/${postSlug}/`, // Base for relative links
          renderer: {
            link(href, title, text) {
              // Handle relative file paths
              if (href.startsWith('./') || href.startsWith('../')) {
                // Resolve relative to post URL
                const resolvedUrl = new URL(href, `https://example.com/post/${postSlug}/`).pathname;
                return `<a href="${resolvedUrl}"${title ? ` title="${title}"` : ''}>${text}</a>`;
              }
              // Handle absolute paths to /posts/ directory
              if (href.startsWith('/posts/')) {
                // Convert to post view URL
                const postPath = href.replace('/posts/', '').replace('.md', '');
                return `<a href="/post/${postPath}.html"${title ? ` title="${title}"` : ''}>${text}</a>`;
              }
              // Default behavior for other URLs
              return `<a href="${href}"${title ? ` title="${title}"` : ''}${!href.startsWith('#') ? ' target="_blank" rel="noopener noreferrer"' : ''}>${text}</a>`;
            },
            image(src, title, alt) {
              // Handle relative image paths
              if (src.startsWith('./') || src.startsWith('../')) {
                const resolvedSrc = new URL(src, `https://raw.githubusercontent.com/${cms.owner}/${cms.repo}/main/posts/${postSlug}/`).href;
                return `<img src="${resolvedSrc}" alt="${alt || ''}"${title ? ` title="${title}"` : ''} class="my-4 rounded-lg">`;
              }
              // Default behavior
              return `<img src="${src}" alt="${alt || ''}"${title ? ` title="${title}"` : ''} class="my-4 rounded-lg">`;
            }
          }
        });
        
        document.getElementById('post-content').innerHTML = marked.parse(markdown);
        
      } catch (error) {
        container.innerHTML = `
          <div class="bg-red-50 p-6 rounded-lg text-center">
            <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
            <h3 class="text-xl font-bold mb-2">Error Loading Post</h3>
            <p class="mb-4">${error.message || 'Post not found'}</p>
            <div class="flex justify-center gap-4">
              <a href="/" class="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">
                <i class="fas fa-home mr-2"></i> Home
              </a>
              <button onclick="window.location.reload()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                <i class="fas fa-sync-alt mr-2"></i> Retry
              </button>
            </div>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
