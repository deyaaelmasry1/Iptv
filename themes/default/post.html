<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post View</title>
  <link rel="stylesheet" href="/themes/default/style.css">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="header-container"></div>

  <main class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="mb-6">
      <a href="/" class="inline-flex items-center text-blue-600 hover:text-blue-800">
        <i class="fas fa-arrow-left mr-2"></i> 
        <span>Back to all posts</span>
      </a>
    </div>

    <div id="post-container">
      <div class="text-center py-12">
        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-blue-500 mx-auto"></div>
        <p class="mt-4 text-gray-500">Loading post content...</p>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/js/theme-manager.js"></script>
  <script src="/js/github-api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const theme = new ThemeManager();
      const cms = new GitHubCMS();
      
      try {
        // Load theme
        await theme.init();
        theme.applyTemplate('header', 'header-container');
        theme.applyTemplate('footer', 'footer-container');

        // Get post slug from URL
        const slug = window.location.pathname
          .split('/')
          .pop()
          .replace('.html', '');

        // Load post data
        const posts = await cms.getPosts();
        const post = posts.find(p => p.slug === slug);
        
        if (!post) throw new Error('Post not found');

        // Set page title
        document.title = `${post.title} | My Blog`;

        // Render post
        await theme.renderPost(post, 'post-container');

      } catch (error) {
        console.error('Failed to load post:', error);
        document.getElementById('post-container').innerHTML = `
          <div class="bg-red-50 p-6 rounded-lg text-center">
            <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
            <h3 class="text-xl font-bold mb-2">Error Loading Post</h3>
            <p class="mb-4">${error.message || 'Unknown error'}</p>
            <a href="/" class="inline-block px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
              Return Home
            </a>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
