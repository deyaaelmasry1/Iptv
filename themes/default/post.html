<main class="container mx-auto px-4 py-8 max-w-3xl">
  <!-- Back Button -->
  <div class="mb-6">
    <a href="/" class="inline-flex items-center text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors">
      <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
      Back to all posts
    </a>
  </div>

  <!-- Article Container -->
  <article class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden">
    <!-- Featured Image (Optional) -->
    <div id="post-featured-image" class="hidden h-64 bg-gray-200 dark:bg-gray-700"></div>

    <!-- Article Content -->
    <div class="p-6 md:p-8">
      <!-- Title -->
      <h1 id="post-title" class="text-3xl md:text-4xl font-bold mb-3 text-gray-800 dark:text-white"></h1>

      <!-- Meta Information -->
      <div id="post-meta" class="flex flex-wrap items-center text-gray-500 dark:text-gray-400 mb-6 space-x-4">
        <div class="flex items-center">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          <span id="post-date"></span>
        </div>
        <div class="flex items-center">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span id="reading-time"></span>
        </div>
      </div>

      <!-- Tags/Categories -->
      <div id="post-tags" class="flex flex-wrap gap-2 mb-6"></div>

      <!-- Content -->
      <div id="post-content" class="prose dark:prose-invert max-w-none">
        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
          <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500 mx-auto"></div>
          <p class="mt-4 text-gray-500 dark:text-gray-400">Loading post...</p>
        </div>
      </div>

      <!-- Author Bio (Optional) -->
      <div id="author-bio" class="hidden mt-12 pt-6 border-t border-gray-200 dark:border-gray-700">
        <div class="flex items-center">
          <img src="https://via.placeholder.com/64" alt="Author" class="w-12 h-12 rounded-full mr-4">
          <div>
            <h4 class="font-semibold text-gray-800 dark:text-white">Author Name</h4>
            <p class="text-gray-600 dark:text-gray-300">Author bio goes here...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <div class="px-6 md:px-8 py-4 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700">
      <div class="flex justify-between">
        <a id="prev-post" href="#" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors flex items-center">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          Previous
        </a>
        <a id="next-post" href="#" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors flex items-center">
          Next
          <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        </a>
      </div>
    </div>
  </article>

  <!-- Related Posts (Optional) -->
  <section id="related-posts" class="hidden mt-12">
    <h3 class="text-2xl font-bold mb-6 text-gray-800 dark:text-white">Related Posts</h3>
    <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
  </section>
</main>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    // Get post slug from URL
    const slug = window.location.pathname.split('/post/')[1]?.replace('.html', '');
    if (!slug) return;

    try {
      // Load post content
      const response = await fetch(`/posts/${slug}.md`);
      if (!response.ok) throw new Error('Post not found');
      
      const markdown = await response.text();
      const { content, metadata } = parseMarkdown(markdown);

      // Render post
      document.getElementById('post-title').textContent = metadata.title || formatTitleFromSlug(slug);
      document.getElementById('post-date').textContent = metadata.date || formatDateFromSlug(slug);
      document.getElementById('post-content').innerHTML = marked.parse(content);
      
      // Calculate reading time
      const words = content.split(/\s+/).length;
      const readingTime = Math.ceil(words / 200);
      document.getElementById('reading-time').textContent = `${readingTime} min read`;

      // Render tags if available
      if (metadata.tags) {
        const tagsContainer = document.getElementById('post-tags');
        metadata.tags.split(',').forEach(tag => {
          const tagElement = document.createElement('span');
          tagElement.className = 'px-3 py-1 text-sm rounded-full bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-100';
          tagElement.textContent = tag.trim();
          tagsContainer.appendChild(tagElement);
        });
      }

      // Hide loading state
      document.getElementById('loading').remove();

    } catch (error) {
      console.error('Error loading post:', error);
      document.getElementById('post-content').innerHTML = `
        <div class="text-center py-12">
          <div class="bg-red-50 dark:bg-gray-700 inline-block p-4 rounded-full mb-4">
            <svg class="w-12 h-12 text-red-500 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
          <h3 class="text-xl font-medium text-gray-800 dark:text-white mb-2">Error Loading Post</h3>
          <p class="text-gray-600 dark:text-gray-300 mb-6">${error.message || 'The post could not be loaded.'}</p>
          <a href="/" class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
            Return to Homepage
          </a>
        </div>
      `;
    }
  });

  function parseMarkdown(markdown) {
    // Simple front matter parser
    const meta = {};
    let content = markdown;
    
    if (markdown.startsWith('---')) {
      const end = markdown.indexOf('---', 3);
      if (end > 0) {
        const frontmatter = markdown.substring(3, end);
        content = markdown.substring(end + 3).trim();
        
        frontmatter.split('\n').forEach(line => {
          const match = line.match(/^([a-z]+):\s*(.*)$/i);
          if (match) meta[match[1].toLowerCase()] = match[2].trim();
        });
      }
    }
    
    return { content, metadata: meta };
  }

  function formatTitleFromSlug(slug) {
    return slug
      .replace(/^\d{4}-\d{2}-\d{2}-/, '')
      .replace(/-/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  function formatDateFromSlug(slug) {
    const dateMatch = slug.match(/^(\d{4}-\d{2}-\d{2})/);
    if (dateMatch) {
      try {
        return new Date(dateMatch[1]).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
      } catch {
        return dateMatch[1];
      }
    }
    return '';
  }
</script>
