<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post View</title>
  <!-- Load theme CSS first -->
  <link rel="stylesheet" href="/themes/default/style.css">
  <!-- Then load Tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Header injection point -->
  <div id="header-container"></div>

  <main class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="mb-6">
      <a href="/" class="inline-flex items-center text-blue-600 hover:text-blue-800">
        <i class="fas fa-arrow-left mr-2"></i> Back to all posts
      </a>
    </div>

    <div id="post-container">
      <!-- Loading state -->
      <div class="text-center py-12">
        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-blue-500 mx-auto"></div>
        <p class="mt-4 text-gray-500">Loading post content...</p>
      </div>
    </div>
  </main>

  <!-- Footer injection point -->
  <div id="footer-container"></div>

  <!-- Scripts must load in this exact order -->
  <script src="/js/theme-manager.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // 1. First load theme
        const theme = new ThemeManager();
        await theme.loadTemplates();
        
        // 2. Apply header/footer
        theme.applyTemplate('header', 'header-container');
        theme.applyTemplate('footer', 'footer-container');
        
        // 3. Then load post content
        const pathParts = window.location.pathname.split('/');
        const postSlug = pathParts[pathParts.length - 1].replace('.html', '');
        const response = await fetch(`/posts/${postSlug}.md?nocache=${Date.now()}`);
        
        if (!response.ok) throw new Error('Post not found');
        
        const markdown = await response.text();
        
        // Extract title from first H1 or filename
        const titleMatch = markdown.match(/^#\s+(.+)$/m);
        const title = titleMatch ? titleMatch[1] : 
          postSlug.replace(/^\d{4}-\d{2}-\d{2}-/, '')
                 .replace(/-/g, ' ')
                 .replace(/\b\w/g, c => c.toUpperCase());
        
        // Format date from filename
        const postDate = postSlug.match(/^(\d{4}-\d{2}-\d{2})/)?.[0];
        const formattedDate = postDate ? new Date(postDate).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        }) : '';

        // Update page
        document.title = `${title} | My Blog`;
        document.getElementById('post-container').innerHTML = `
          <article class="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow">
            <div class="p-6">
              <div class="flex items-center text-sm text-gray-500 mb-2">
                <i class="far fa-calendar mr-2"></i>
                ${formattedDate}
              </div>
              <h1 class="text-2xl font-bold text-gray-800 mb-6">${title}</h1>
              <div class="prose max-w-none" id="post-content"></div>
            </div>
          </article>
        `;
        
        // Render markdown (excluding the first H1 if it exists)
        document.getElementById('post-content').innerHTML = 
          marked.parse(titleMatch ? markdown.replace(/^#\s+.+\n/, '') : markdown);
          
      } catch (error) {
        console.error("Post loading error:", error);
        document.getElementById('post-container').innerHTML = `
          <div class="bg-red-50 p-6 rounded-lg text-center">
            <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
            <h3 class="text-xl font-bold mb-2">Error Loading Post</h3>
            <p class="mb-4">${error.message || 'Unknown error'}</p>
            <a href="/" class="inline-block px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
              Return Home
            </a>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
