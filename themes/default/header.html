<header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-50 transition-colors duration-300">
  <div class="container mx-auto px-4">
    <!-- Mobile Menu Button (Hidden on desktop) -->
    <div class="md:hidden flex justify-between items-center py-3">
      <a href="/" class="text-2xl font-bold text-gray-800 dark:text-white hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
        My Blog
      </a>
      <button id="mobile-menu-button" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>

    <!-- Desktop Navigation -->
    <div class="hidden md:flex flex-col md:flex-row justify-between items-center py-4">
      <a href="/" class="text-2xl font-bold text-gray-800 dark:text-white hover:text-blue-600 dark:hover:text-blue-400 transition-colors mb-4 md:mb-0">
        My Blog
      </a>
      
      <nav class="w-full md:w-auto">
        <ul class="flex flex-col md:flex-row space-y-2 md:space-y-0 md:space-x-6">
          <li>
            <a href="/" class="px-3 py-2 text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium block transition-colors">
              <i class="fas fa-home mr-2"></i>Home
            </a>
          </li>
          <li class="relative group">
            <button class="px-3 py-2 text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium flex items-center transition-colors">
              <i class="fas fa-tags mr-2"></i>Categories
              <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </button>
            <div class="absolute left-0 mt-2 w-48 bg-white dark:bg-gray-700 rounded-md shadow-lg py-1 z-50 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300">
              <a href="/category/technology" class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-600">Technology</a>
              <a href="/category/tutorials" class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-600">Tutorials</a>
              <a href="/category/updates" class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-600">Updates</a>
            </div>
          </li>
          <li>
            <a href="/about" class="px-3 py-2 text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium block transition-colors">
              <i class="fas fa-info-circle mr-2"></i>About
            </a>
          </li>
          <li>
            <a href="/admin/" class="px-3 py-2 text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 font-medium block transition-colors">
              <i class="fas fa-lock mr-2"></i>Admin
            </a>
          </li>
          <li class="md:hidden">
            <button id="theme-toggle" class="px-3 py-2 text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium flex items-center transition-colors">
              <i class="fas fa-moon mr-2"></i>Dark Mode
            </button>
          </li>
        </ul>
      </nav>
    </div>

    <!-- Mobile Menu (Hidden by default) -->
    <div id="mobile-menu" class="hidden md:hidden pb-4 transition-all duration-300">
      <ul class="space-y-2">
        <li>
          <a href="/" class="block px-3 py-2 text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium transition-colors">
            <i class="fas fa-home mr-2"></i>Home
          </a>
        </li>
        <li>
          <a href="/category/technology" class="block px-3 py-2 text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium transition-colors">
            <i class="fas fa-tag mr-2"></i>Technology
          </a>
        </li>
        <li>
          <a href="/category/tutorials" class="block px-3 py-2 text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium transition-colors">
            <i class="fas fa-tag mr-2"></i>Tutorials
          </a>
        </li>
        <li>
          <a href="/about" class="block px-3 py-2 text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium transition-colors">
            <i class="fas fa-info-circle mr-2"></i>About
          </a>
        </li>
        <li>
          <a href="/admin/" class="block px-3 py-2 text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 font-medium transition-colors">
            <i class="fas fa-lock mr-2"></i>Admin
          </a>
        </li>
        <li>
          <button id="mobile-theme-toggle" class="w-full text-left px-3 py-2 text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium flex items-center transition-colors">
            <i class="fas fa-moon mr-2"></i>Dark Mode
          </button>
        </li>
      </ul>
    </div>
  </div>

  <script>
    // Mobile menu toggle
    document.getElementById('mobile-menu-button').addEventListener('click', function() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    });

    // Theme toggle functionality
    function setupThemeToggle(buttonId) {
      const button = document.getElementById(buttonId);
      if (!button) return;

      button.addEventListener('click', function() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        
        // Update icon
        const icon = this.querySelector('i');
        if (icon) {
          icon.classList.toggle('fa-moon');
          icon.classList.toggle('fa-sun');
        }
      });

      // Initialize icon based on current theme
      if (localStorage.getItem('theme') === 'dark' || 
          (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        const icon = button.querySelector('i');
        if (icon) {
          icon.classList.remove('fa-moon');
          icon.classList.add('fa-sun');
        }
      }
    }

    // Setup both desktop and mobile theme toggles
    setupThemeToggle('theme-toggle');
    setupThemeToggle('mobile-theme-toggle');
  </script>
</header>
